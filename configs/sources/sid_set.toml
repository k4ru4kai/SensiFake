version = 1
provider = "huggingface"

[adapter]
name = "sid_set"

[adapter.label_mapping]
"0" = "real"
"1" = "fake"
"2" = "skip"

[dataset]
id = "saberzl/SID_Set"
revision = "main"
split = "train"
# No named dataset configuration is currently assumed.
config = ""
streaming = true
accepted_labels = ["real", "fake"]

# Future offline smoke-test scale only. This task does not start collection.
[collection]
target = 10
seed = 42
shuffle = false
shuffle_buffer = 0
checkpoint_interval = 5
max_runtime_minutes = 30
shutdown_safety_buffer_seconds = 60
resume = true

[collection.quotas]
real = 5
fake = 5

[retry]
count = 4
initial_backoff_seconds = 2.0
maximum_backoff_seconds = 30.0

[kaggle]
enabled = false
sync_every = 5
dataset_id = "saracristinabasco/sensifake-sid-set-smoke"
title = "SensiFake SID-Set Smoke Test"
license_name = "other"
license_description = "Future derived smoke test; SID-Set source terms continue to apply."
private = true
subprocess_timeout_seconds = 300
