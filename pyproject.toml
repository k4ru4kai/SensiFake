[project]
name = "sensifake"
version = "0.1.0"
description = "Content-sensitivity-aware deepfake detection research project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets",
    "pandas>=3.0.5",
    "pillow",
    "pyarrow==25.0.1",
    "streamlit>=1.62.0",
    "tqdm",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
benchmark = [
    "albumentations",
    "dlib",
    "efficientnet-pytorch",
    "einops",
    "filterpy",
    "fvcore",
    "imageio",
    "imgaug",
    "imutils",
    "kornia",
    "loralib",
    "matplotlib",
    "numpy<2",
    "opencv-python-headless",
    "pytorchvideo",
    "pyyaml",
    "scikit-image",
    "scikit-learn",
    "scipy",
    "seaborn",
    "segmentation-models-pytorch",
    "simplejson",
    "tensorboard",
    "timm",
    "torch",
    "torchtoolbox",
    "torchvision",
    "transformers",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
